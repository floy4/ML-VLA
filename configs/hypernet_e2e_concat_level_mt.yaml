rung: fullvw4
# Multitask (max-CHR level domains): no task_prompt -> per-episode prompts from
# each domain's meta/tasks.parquet (40 LIBERO tasks per domain).
task_prompt: null
feature_cache_dir: /home/zhy/vla/meta_lora/outputs/feature_cache_level
train_domains:
  - camera_L1
  - camera_L2
  - lighting_L1
  - lighting_L2
  - noise_L1
  - noise_L2
  - texture_L1
  - texture_L2
weight_target:
  max_modules: 458
  exclude_key_substrings: [lm_head]
training:
  # 8-GPU DDP (torchrun --nproc_per_node=8): effective batch 8*8=64.
  # One epoch ~= 848k frames / 64 ~= 13.3k steps. lr = 3e-4 * sqrt(64/8)
  # (batch 8 -> 64 sqrt scaling).
  max_steps: 13000
  batch_size: 8
  lr: 8.5e-4
  weight_decay: 0.01
  warmup: 500
  clip: 1.0
  val_every: 500
  save_every: 1000
  evidence_k: 8
hypernet:            # V4DirectABHyperNetwork (same as single-task concat)
  dino_dim: 1024
  condition_hidden_dim: 256
  hidden_dim: 512
  id_dim: 256
  trunk_layers: 6
  trunk_hidden: 1024
