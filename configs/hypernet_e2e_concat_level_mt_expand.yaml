rung: fullvw4
# Expand: warm-start fixlight2 step5000.pt (12-domain mean 0.654, best e2e)
# + four new train domains: add_object L1/L2/L3 (VLM object-count delta
# banding, /data6/zhy/wizard_level_multitask) and clean (original LIBERO
# download, 1693 eps). Single-variable change vs fixlight2: the domain set.
# The fixlight2 weighting recipe is kept verbatim (lighting_L3 x2,
# lighting_L3__deep x3) so the 0.654 baseline stays directly comparable;
# new domains enter at weight 1.0 (4 of 17 units ~ 24% of steps).
# add_object/clean have no oracle experts: canonical_npz borrowed from
# texture_L2 (structure only — scales are frozen from the init checkpoint,
# and the duplicate targets never reach the loss).
# Launch with: train_e2e.py --init-checkpoint .../e2e_concat_level_mt_fixlight2/step5000.pt
task_prompt: null
feature_cache_dir: /home/zhy/vla/meta_lora/outputs/feature_cache_level
train_domains:
  - camera_L1
  - camera_L2
  - lighting_L1
  - lighting_L2
  - lighting_L3
  - lighting_L3__deep
  - noise_L1
  - noise_L2
  - texture_L1
  - texture_L2
  - add_object_L1
  - add_object_L2
  - add_object_L3
  - clean
train_domain_weights:
  lighting_L3: 2.0
  lighting_L3__deep: 3.0
train_pool_from_bank:
  - lighting_L3__deep
weight_target:
  max_modules: 458
  exclude_key_substrings: [lm_head]
training:
  # Continuation: same flat lr as fixlight/fixlight2; 20k steps (user-set) for
  # the four new domains to be absorbed (fixlight2 absorbed one pseudo-domain
  # in 5k; checkpoints every 2500 let the best step be picked post hoc).
  max_steps: 20000
  batch_size: 8
  lr: 1.5e-4
  lr_constant: true
  weight_decay: 0.01
  warmup: 100
  clip: 1.0
  val_every: 500
  save_every: 2500
  evidence_k: 8
hypernet:            # V4DirectABHyperNetwork (same as e2e_concat_level_mt)
  dino_dim: 1024
  condition_hidden_dim: 256
  hidden_dim: 512
  id_dim: 256
  trunk_layers: 6
  trunk_hidden: 1024
