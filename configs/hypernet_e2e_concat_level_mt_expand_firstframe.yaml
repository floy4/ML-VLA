rung: fullvw4_ff
# First-frame evidence retrain: identical to hypernet_e2e_concat_level_mt_expand
# (14 domains, fixlight2 weighting recipe) except the feature cache holds
# frame-0-only evidence ([n_ep, 1, 1024]) instead of 4-frame reservoir means.
# Warm-start from the converged expand step20000; 30k steps (user-set; the
# original expand run also used 20k from its own warm start) with checkpoints
# every 1000 for post-hoc best pick.
# Launch: train_e2e.py --init-checkpoint .../e2e_concat_level_mt_expand/step20000.pt
task_prompt: null
feature_cache_dir: /data2/zhy/meta_lora_offload/feature_cache_level_firstframe
train_domains:
  - camera_L1
  - camera_L2
  - lighting_L1
  - lighting_L2
  - lighting_L3
  - lighting_L3__deep
  - noise_L1
  - noise_L2
  - texture_L1
  - texture_L2
  - add_object_L1
  - add_object_L2
  - add_object_L3
  - clean
train_domain_weights:
  lighting_L3: 2.0
  lighting_L3__deep: 3.0
train_pool_from_bank:
  - lighting_L3__deep
weight_target:
  max_modules: 458
  exclude_key_substrings: [lm_head]
training:
  max_steps: 30000
  batch_size: 8
  lr: 1.5e-4
  lr_constant: true
  weight_decay: 0.01
  warmup: 100
  clip: 1.0
  val_every: 500
  save_every: 1000
  evidence_k: 8
hypernet:            # V4DirectABHyperNetwork (same as e2e_concat_level_mt)
  dino_dim: 1024
  condition_hidden_dim: 256
  hidden_dim: 512
  id_dim: 256
  trunk_layers: 6
  trunk_hidden: 1024
