rung: fullvw4
task_prompt: "open the middle drawer of the cabinet"
feature_cache_dir: /home/zhy/vla/meta_lora/outputs/feature_cache_90
train_domains:
  - c1_v1l1__de2a6ce7
  - c2_v2l2__de2a6ce7
  - l1_warm_dim__de2a6ce7
  - l2_cool_bright__de2a6ce7
  - v1_azimuth30__de2a6ce7
  - v2_azimuth60__de2a6ce7
  - v3_elev15_zoom125__de2a6ce7
  - clean__de2a6ce7
weight_target:
  max_modules: 458
  # v1 Concat column (v4.pt) module set: 456 — the two lm_head rows (B=vocab
  # 257k) would inflate V4 heads to ~4.9B params and receive zero gradient.
  exclude_key_substrings: [lm_head]
pose_feature:         # VGGT CAMERA-token pose scheme (cond width 1024+2048=3072)
  scheme: vggt
  cache: /data2/zhy/meta_lora_offload/pose_cache/vggt_pose_cache.npz
  layer: 23            # task-3 layer ruling
training:
  max_steps: 60000
  batch_size: 8
  lr: 3.0e-4
  weight_decay: 0.01
  warmup: 1000
  clip: 1.0
  val_every: 1000
  save_every: 5000
  evidence_k: 8
hypernet:            # V4DirectABHyperNetwork
  dino_dim: 1024
  condition_hidden_dim: 256
  hidden_dim: 512
  id_dim: 256
  trunk_layers: 6
  trunk_hidden: 1024
